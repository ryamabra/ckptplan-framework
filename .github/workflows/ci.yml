name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / torch ${{ matrix.torch-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every cell: one broken combination must not hide the others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        torch-version: ["2.5.0", "2.13.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU build)
        # The CPU wheel index avoids pulling the CUDA runtime, which is both
        # unnecessary here and far larger. These runners have no GPU.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${{ matrix.torch-version }}" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install ckptplan
        # torch is already satisfied above, so this resolves only the dev extras.
        run: python -m pip install -e ".[dev]"

      - name: Show environment
        run: |
          python -c "import sys, torch; print(sys.version); print('torch', torch.__version__); print('cuda available', torch.cuda.is_available())"

      - name: Run tests
        # CPU only. Nothing here touches a GPU or Modal: the CUDA profiling and
        # benchmark paths are exercised separately in the A10G workflow, and the
        # Modal scripts import without Modal installed by design.
        run: python -m pytest -q

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ckptplan and type checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy

  native:
    name: C++ planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build --parallel 2

      - name: Test
        run: ctest --test-dir native/build --output-on-failure

  dashboard:
    name: React dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
